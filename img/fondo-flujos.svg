<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <!--
    Fondo del sitio: un mapa de procesos abstracto. A la izquierda, una cadena documental
    (cotización → orden → remisión → factura) que termina en el nodo fiscal en rojo; a la
    derecha, un flujo con decisión; abajo, un tablero de indicadores. Sin texto, a propósito:
    es textura, no contenido. Los paneles del sitio lo cubren casi todo; se ve en los márgenes
    y entre secciones.
  -->
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="rgba(255,255,255,0.22)"/>
    </marker>
    <g id="lineas">
      <rect x="18" y="20" width="84" height="6" rx="3" fill="rgba(255,255,255,0.14)"/>
      <rect x="18" y="34" width="56" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
    </g>
  </defs>

  <g fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.16)" stroke-width="1.5">
    <!-- Cadena documental, columna izquierda -->
    <rect x="48" y="120" width="160" height="64" rx="10"/>
    <rect x="48" y="300" width="160" height="64" rx="10"/>
    <rect x="48" y="480" width="160" height="64" rx="10"/>
    <!-- Rama lateral -->
    <rect x="268" y="390" width="120" height="52" rx="10"/>
    <!-- Flujo de la derecha -->
    <rect x="1330" y="440" width="120" height="56" rx="10"/>
    <rect x="1470" y="440" width="104" height="56" rx="10"/>
    <rect x="1376" y="620" width="160" height="60" rx="10"/>
    <!-- Tablero de indicadores, abajo a la izquierda -->
    <rect x="48" y="800" width="120" height="96" rx="10"/>
    <rect x="184" y="800" width="120" height="96" rx="10"/>
    <rect x="320" y="800" width="190" height="96" rx="10"/>
    <!-- Sparkline, abajo a la derecha -->
    <rect x="1330" y="790" width="244" height="110" rx="10"/>
  </g>

  <!-- Nodo fiscal (factura) en rojo y nodo de entrada en azul -->
  <rect x="48" y="660" width="160" height="64" rx="10" fill="rgba(229,72,77,0.09)" stroke="rgba(255,122,122,0.5)" stroke-width="1.5"/>
  <rect x="1376" y="150" width="160" height="60" rx="10" fill="rgba(33,150,243,0.08)" stroke="rgba(124,196,250,0.45)" stroke-width="1.5"/>
  <!-- Decisión -->
  <path d="M1456 286 L1500 330 L1456 374 L1412 330 Z" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

  <!-- Renglones dentro de los nodos: sugieren documentos y formularios -->
  <use href="#lineas" x="48" y="120"/>
  <use href="#lineas" x="48" y="300"/>
  <use href="#lineas" x="48" y="480"/>
  <use href="#lineas" x="48" y="660"/>
  <use href="#lineas" x="1376" y="150"/>
  <use href="#lineas" x="1376" y="620"/>

  <!-- Conectores -->
  <g fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="1.5" marker-end="url(#f)">
    <path d="M128 184 V292"/>
    <path d="M128 364 V472"/>
    <path d="M128 544 V652"/>
    <path d="M208 332 H238 V416 H260"/>
    <path d="M1456 210 V278"/>
    <path d="M1412 330 H1390 V432"/>
    <path d="M1500 330 H1522 V432"/>
    <path d="M1390 496 V560 H1440 V612"/>
    <path d="M1522 496 V560 H1472 V612"/>
    <path d="M1456 680 V782"/>
  </g>

  <!-- Barras de los indicadores -->
  <g fill="rgba(255,255,255,0.12)">
    <rect x="70" y="822" width="56" height="8" rx="4"/>
    <rect x="70" y="846" width="34" height="20" rx="3"/>
    <rect x="206" y="822" width="56" height="8" rx="4"/>
    <rect x="206" y="846" width="44" height="20" rx="3"/>
    <rect x="344" y="868" width="14" height="14" rx="2"/>
    <rect x="366" y="856" width="14" height="26" rx="2"/>
    <rect x="388" y="846" width="14" height="36" rx="2"/>
    <rect x="410" y="836" width="14" height="46" rx="2"/>
  </g>
  <rect x="432" y="824" width="14" height="58" rx="2" fill="rgba(255,122,122,0.45)"/>

  <!-- Línea de tendencia -->
  <polyline points="1352,876 1388,862 1420,868 1452,842 1486,848 1518,822 1552,812" fill="none" stroke="rgba(124,196,250,0.5)" stroke-width="2"/>
  <g fill="rgba(124,196,250,0.6)">
    <circle cx="1452" cy="842" r="3"/>
    <circle cx="1552" cy="812" r="3"/>
  </g>

  <!-- Trazo punteado superior: conecta ambos lados por detrás del contenido -->
  <path d="M208 152 H560 M1040 180 H1376" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" stroke-dasharray="4 8"/>
  <g fill="rgba(255,255,255,0.25)">
    <circle cx="560" cy="152" r="3"/>
    <circle cx="1040" cy="180" r="3"/>
    <circle cx="238" cy="332" r="3"/>
    <circle cx="1440" cy="560" r="3"/>
    <circle cx="1472" cy="560" r="3"/>
  </g>
</svg>
